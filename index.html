<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRIME Admin — Project Details</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Roboto+Flex:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap">
<style>
/* ===== colors_and_type.css ===== */
/* ============================================================
   PrimeAdmin 3 — Colors & Type
   Material-style admin design system.
   v2 (Aug 2026): squared buttons, trimmed palette, caps heading
   ladder, softened elevation. Reconciled against the Activity
   Details redesign, the Admin 3 Pattern Library, and the
   Newsletters build.
   ============================================================ */





:root {
  /* ---------- Interactive blue -------------------------------
     One accent per action class. Blue is anything that changes
     data; aqua is reserved for links that leave the page. */
  --pa-primary:        rgb(25, 118, 210);
  --pa-primary-700:    rgb(17,  71, 161);  /* active tab, pressed, link hover */
  --pa-primary-050:    rgb(238, 245, 252); /* inline sub-panels, row hover */
  --pa-primary-12a:    rgba(25, 118, 210, 0.12); /* selected chip / tag fill */
  --pa-primary-04a:    rgba(25, 118, 210, 0.04); /* hover film */

  /* ---------- Aqua — external-link buttons only -------------- */
  --pa-aqua-500:       rgb(  0, 173, 238);

  /* ---------- Ink -------------------------------------------- */
  --pa-ink:            rgb( 33,  33,  33); /* headings, body */
  --pa-ink-2:          rgb( 66,  66,  66); /* icon default, rule copy */
  --pa-ink-3:          rgb(102, 102, 102); /* field labels, helper text */
  --pa-ink-4:          rgb(113, 113, 113); /* meta values, secondary rows */
  --pa-ink-6:          rgb(137, 147, 158); /* placeholder, empty value */
  --pa-ink-7:          rgb(158, 158, 158); /* disabled border, empty glyph */

  /* ---------- Surfaces --------------------------------------- */
  --pa-paper:          rgb(255, 255, 255);
  --pa-band:           rgb(240, 240, 240); /* section band — the only
                                              non-white content surface */
  --pa-line:           rgb(238, 238, 238); /* hairline */
  --pa-line-2:         rgb(224, 224, 224); /* unselected chip */
  --pa-divider:        rgba(0, 0, 0, 0.12); /* card + modal borders */
  --pa-rule:           rgba(0, 0, 0, 0.60); /* list-table head rule */
  --pa-sidebar-bg:     rgb( 32,  32,  32);
  --pa-sidebar-active: rgb( 62,  62,  62);
  --pa-avatar-green:   rgb( 76, 175,  80); /* signed-in user, header only */

  /* ---------- Field chrome -----------------------------------
     Record fields focus to black, not blue: the underline is
     structure, not an action. */
  --pa-field-line:     rgba(0, 0, 0, 0.42);
  --pa-field-focus:    rgb(0, 0, 0);

  /* ---------- Semantic — status text, toasts, validation ------ */
  --pa-success:        rgb( 46, 125,  50);
  --pa-success-bg:     rgb(232, 245, 233);
  --pa-warning:        rgb(233, 143,  40);
  --pa-warning-bg:     rgb(255, 244, 229);
  --pa-error:          rgb(211,  47,  47);
  --pa-error-bg:       rgb(253, 237, 237);

  /* ---------- Type stack ------------------------------------- */
  --pa-font-sans:       "Roboto", system-ui, sans-serif;
  --pa-font-display:    "Roboto Flex", "Roboto", system-ui, sans-serif;
  --pa-font-modal:      "Inter", "Roboto", system-ui, sans-serif;

  /* ---------- Radii ------------------------------------------
     Buttons are squared. The 16px pill is reserved for chips,
     role badges, and status pills. */
  --pa-radius-xs:    2px;   /* table cells */
  --pa-radius-sm:    4px;   /* cards, buttons, fields, search */
  --pa-radius-lg:    8px;   /* modals, panels, dropzone */
  --pa-radius-pill: 16px;   /* chips, badges */

  /* ---------- Elevation -------------------------------------- */
  --pa-elev-1: 0 1px 2px 0 rgba(0,0,0,0.05), 0 1px 1px -1px rgba(0,0,0,0.05);
  --pa-elev-2: 0 1px 5px 0 rgba(0,0,0,0.12),
               0 2px 2px 0 rgba(0,0,0,0.14),
               0 3px 1px -2px rgba(0,0,0,0.20);                  /* buttons */
  --pa-elev-card: 0 10px 13px -5px rgba(0,0,0,0.05),
                  0 4px 5px -6px rgba(0,0,0,0.05);               /* form cards */
  --pa-elev-raised: 0 20px 25px -5px rgba(0,0,0,0.10),
                    0 8px 10px -6px rgba(0,0,0,0.10);            /* faculty card, toast */
  --pa-elev-modal: 0 9px 46px 8px rgba(0,0,0,0.12),
                   0 24px 38px 3px rgba(0,0,0,0.14),
                   0 11px 15px -7px rgba(0,0,0,0.20);            /* modals, drawers */

  /* ---------- Spacing ---------------------------------------- */
  --pa-s-1:  4px;
  --pa-s-2:  8px;
  --pa-s-3: 12px;
  --pa-s-4: 16px;
  --pa-s-5: 20px;
  --pa-s-6: 24px;   /* between stacked fields, between cards */
  --pa-s-8: 32px;   /* page gutter, card padding */
  --pa-s-10: 40px;  /* between paired columns */
  --pa-s-15: 60px;
}

/* ============================================================
   Heading ladder — all caps, Roboto Regular, one role per level
   ============================================================ */

/* Page title. One per page. */
.pa-page-title {
  font-family: var(--pa-font-sans);
  font-weight: 400;
  font-size: 26px;
  line-height: 34px;
  letter-spacing: 1.3px;
  text-transform: uppercase;
  color: var(--pa-primary);
  margin: 0;
}

/* Screen heading — names the record, carries its code in parens. */
.pa-screen-title {
  font-family: var(--pa-font-sans);
  font-weight: 400;
  font-size: 22px;
  line-height: 30px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--pa-ink);
  margin: 0;
}

/* Card section band title — sits on --pa-band. */
.pa-band-title {
  font-family: var(--pa-font-sans);
  font-weight: 400;
  font-size: 18px;
  line-height: 26px;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  color: var(--pa-ink);
  margin: 0;
}

/* Rail heading — groups right-hand utility stacks. */
.pa-rail-title {
  font-family: var(--pa-font-sans);
  font-weight: 400;
  font-size: 19px;
  line-height: 26px;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  color: var(--pa-ink);
  margin: 0;
}

/* Modal / drawer title — Inter, the only place it appears. */
.pa-modal-title {
  font-family: var(--pa-font-modal);
  font-weight: 500;
  font-size: 20px;
  line-height: 26px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--pa-ink);
  margin: 0;
}

/* ============================================================
   Body, meta, and control type
   ============================================================ */

.pa-body-16 { font-family: var(--pa-font-display); font-size: 16px; line-height: 24px; letter-spacing: 0.1px; color: var(--pa-ink); }
.pa-body-14 { font-family: var(--pa-font-sans); font-size: 14px; line-height: 20px; color: var(--pa-ink); }
.pa-body-13 { font-family: var(--pa-font-sans); font-size: 13.5px; line-height: 20px; color: var(--pa-ink); }
.pa-body-12 { font-family: var(--pa-font-sans); font-size: 12px; line-height: 18px; color: var(--pa-ink); }

/* Helper text. Belongs to the field it explains, never the group. */
.pa-helper { font-family: var(--pa-font-sans); font-size: 12px; line-height: 18px; color: var(--pa-ink-3); }

/* Meta strip under a page title: key in caps, value in medium. */
.pa-meta { display: flex; flex-wrap: wrap; gap: 6px 30px; font-family: var(--pa-font-sans); font-size: 13px; }
.pa-meta-key { font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--pa-ink-3); }
.pa-meta-val { font-weight: 500; color: var(--pa-ink); }
.pa-meta-val--success { color: var(--pa-success); font-weight: 500; }
.pa-meta-val--warning { color: var(--pa-warning); font-weight: 500; }
.pa-meta-val--error   { color: var(--pa-error);   font-weight: 500; }

/* Field label at rest, and once floated above the underline. */
.pa-field-label { font-family: var(--pa-font-sans); font-size: 13px; line-height: 19px; color: var(--pa-ink-3); }
.pa-field-label--float { font-size: 11.5px; line-height: 16px; color: var(--pa-ink-3); }

/* Value inside a field. */
.pa-input-text { font-family: var(--pa-font-display); font-size: 13.5px; line-height: 20px; color: var(--pa-ink); }

.pa-button-text { font-family: var(--pa-font-sans); font-weight: 500; font-size: 12px; line-height: 100%; text-transform: uppercase; }
.pa-button-text-sm { font-family: var(--pa-font-display); font-weight: 700; font-size: 10.8px; line-height: 16.2px; text-transform: uppercase; }
.pa-chip-text { font-family: var(--pa-font-display); font-weight: 700; font-size: 10.5px; line-height: 16px; letter-spacing: 0.05em; text-transform: uppercase; }

.pa-caption { font-family: var(--pa-font-sans); font-size: 11.5px; line-height: 16px; color: var(--pa-ink-3); }

/* Section eyebrow inside rule callouts and sub-panels. */
.pa-eyebrow {
  font-family: var(--pa-font-sans);
  font-weight: 500;
  font-size: 12px;
  line-height: 16px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--pa-primary);
}


/* ===== preview/_card.css ===== */
/* Shared styles for preview/* cards. Cards are 700px wide. */

html, body {
  margin: 0;
  padding: 0;
  background: var(--pa-paper);
  font-family: var(--pa-font-sans);
  color: var(--pa-ink);
  -webkit-font-smoothing: antialiased;
}

.card {
  width: 700px;
  box-sizing: border-box;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.card.tight  { padding: 20px; gap: 12px; }
.card.center { align-items: center; justify-content: center; }

.row    { display: flex; flex-direction: row; gap: 12px; align-items: center; }
.col    { display: flex; flex-direction: column; gap: 8px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.grid-6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }

.swatch {
  width: 100%;
  height: 64px;
  border-radius: var(--pa-radius-sm);
  border: 1px solid var(--pa-divider);
}
.swatch-sm { height: 44px; }
.swatch-lg { height: 96px; }

.meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  font-family: var(--pa-font-sans);
}
.meta .name { font-size: 12px; font-weight: 500; color: var(--pa-ink); line-height: 16px; }
.meta .val  { font-size: 11px; color: var(--pa-ink-6); font-family: ui-monospace, monospace; line-height: 14px; }

.token-chip {
  font-family: ui-monospace, "JetBrains Mono", Menlo, monospace;
  font-size: 11px;
  color: var(--pa-ink-3);
  background: var(--pa-line);
  border-radius: var(--pa-radius-xs);
  padding: 2px 6px;
}


/* ===== preview/_components.css ===== */
/* PrimeAdmin 3 — component styles for preview cards, templates, and
   the UI kit. Tokens come from ../colors_and_type.css.
   v2 (Aug 2026): squared buttons, 4px cards, section bands, grid +
   list tables, app chrome, empty states. */

/* ================= Buttons =====================================
   Squared to 4px. Label always all caps. One primary per region. */
.pa-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 32px;
  padding: 0 16px;
  border-radius: var(--pa-radius-sm);
  border: none;
  font-family: var(--pa-font-sans);
  font-weight: 500;
  font-size: 12px;
  line-height: 100%;
  letter-spacing: 0;
  text-transform: uppercase;
  cursor: pointer;
  user-select: none;
  position: relative;
  isolation: isolate;
  transition: background 150ms cubic-bezier(.4,0,.2,1), box-shadow 150ms cubic-bezier(.4,0,.2,1);
}
.pa-btn::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: transparent; pointer-events: none; z-index: 1; }
.pa-btn > * { position: relative; z-index: 2; }
.pa-btn--sm { height: 24px; padding: 0 12px; font-size: 10.8px; }
.pa-btn--lg { height: 40px; padding: 0 20px; }
.pa-btn--block { width: 100%; }
/* Escape hatch: row-level add/remove buttons inside picker drawers. */
.pa-btn--pill { border-radius: var(--pa-radius-pill); }

.pa-btn--primary { background: var(--pa-primary); color: #fff; box-shadow: var(--pa-elev-2); }
.pa-btn--primary:hover::after  { background: rgba(255,255,255,0.08); }
.pa-btn--primary:active::after { background: rgba(0,0,0,0.24); }

.pa-btn--secondary { background: #fff; color: var(--pa-primary); border: 1px solid var(--pa-primary); }
.pa-btn--secondary:hover::after  { background: var(--pa-primary-04a); }
.pa-btn--secondary:active::after { background: rgba(25,118,210,0.24); }

.pa-btn--secondary-grey { background: #fff; color: var(--pa-ink-2); border: 1px solid var(--pa-ink-7); }
.pa-btn--secondary-grey:hover::after  { background: rgba(33,33,33,0.04); }
.pa-btn--secondary-grey:active::after { background: rgba(33,33,33,0.24); }

.pa-btn--tertiary { background: transparent; color: var(--pa-primary); }
.pa-btn--tertiary:hover::after  { background: var(--pa-primary-04a); }
.pa-btn--tertiary:active::after { background: rgba(25,118,210,0.24); }

.pa-btn--tertiary-grey { background: transparent; color: var(--pa-ink-2); }
.pa-btn--tertiary-grey:hover::after  { background: rgba(33,33,33,0.04); }
.pa-btn--tertiary-grey:active::after { background: rgba(33,33,33,0.24); }

/* Destructive: outline for in-page removals, solid only in a confirm dialog. */
.pa-btn--danger-outline { background: #fff; color: var(--pa-error); border: 1px solid var(--pa-error); }
.pa-btn--danger-outline:hover::after { background: rgba(211,47,47,0.06); }
.pa-btn--danger { background: var(--pa-error); color: #fff; box-shadow: var(--pa-elev-2); }
.pa-btn--danger:hover::after { background: rgba(255,255,255,0.08); }

.pa-btn[disabled] { opacity: 0.3; pointer-events: none; box-shadow: none; }
a.pa-btn, a.pa-btn:hover { text-decoration: none; }
a.pa-btn--primary, a.pa-btn--primary:hover, a.pa-btn--danger, a.pa-btn--danger:hover { color: #fff; }
a.pa-btn--secondary-grey, a.pa-btn--secondary-grey:hover { color: var(--pa-ink-2); }

/* Rail link button — aqua, full width, left aligned, open-in-new.
   Only for destinations outside the current page. */
.pa-btn-rail {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  background: var(--pa-aqua-500);
  color: #fff;
  border: none;
  border-radius: var(--pa-radius-sm);
  padding: 11px 14px;
  font-family: var(--pa-font-sans);
  font-weight: 500;
  font-size: 12px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  text-align: left;
  cursor: pointer;
  box-shadow: var(--pa-elev-2);
}
.pa-btn-rail:hover { filter: brightness(1.06); }
.pa-btn-rail i { font-size: 16px; }

/* Icon button — 36px circular target, 6% ink film on hover. Always titled. */
.pa-icon-btn {
  border: none;
  background: transparent;
  cursor: pointer;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--pa-ink-2);
  transition: background 150ms cubic-bezier(.4,0,.2,1);
}
.pa-icon-btn i { font-size: 19px; }
.pa-icon-btn:hover { background: rgba(33,33,33,0.06); }
.pa-icon-btn--sm { width: 32px; height: 32px; }
.pa-icon-btn--primary { color: var(--pa-primary); }
.pa-icon-btn--primary:hover { background: var(--pa-primary-04a); }
.pa-icon-btn--danger { color: var(--pa-error); }
.pa-icon-btn--danger:hover { background: rgba(211,47,47,0.08); }

/* ================= Chips, badges, pills ======================== */
.pa-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 28px;
  padding: 0 12px;
  border-radius: var(--pa-radius-pill);
  font-family: var(--pa-font-display);
  font-weight: 700;
  font-size: 10.8px;
  line-height: 16.2px;
  text-transform: uppercase;
  background: var(--pa-line-2);
  color: var(--pa-ink);
  border: none;
  cursor: pointer;
  user-select: none;
  position: relative;
  isolation: isolate;
}
.pa-chip::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; }
.pa-chip > * { position: relative; z-index: 2; }
.pa-chip--selected { background: var(--pa-primary-12a); color: var(--pa-primary); }
.pa-chip:hover.pa-chip--selected::after { background: var(--pa-primary-04a); }
.pa-chip:hover:not(.pa-chip--selected)::after { background: rgba(33,33,33,0.04); }
.pa-chip[disabled] { opacity: 0.3; pointer-events: none; }

/* Role badge — solid blue pill, not interactive. */
.pa-badge {
  display: inline-flex;
  align-items: center;
  padding: 6px 14px;
  border-radius: var(--pa-radius-pill);
  background: var(--pa-primary);
  color: #fff;
  font-family: var(--pa-font-display);
  font-weight: 700;
  font-size: 10.5px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
/* Count / tag pill — 12% tint. */
.pa-badge--tint { background: var(--pa-primary-12a); color: var(--pa-primary); padding: 4px 11px; font-size: 10px; }
.pa-badge--success { background: var(--pa-success); }

/* Document status pill — outline, icon leads. */
.doc-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 22px;
  padding: 0 10px;
  border-radius: var(--pa-radius-pill);
  border: 1px solid var(--pa-line-2);
  font-family: var(--pa-font-sans);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--pa-ink-3);
  background: #fff;
}
.doc-pill--ok   { border-color: rgba(46,125,50,0.5);  color: var(--pa-success); background: var(--pa-success-bg); }
.doc-pill--warn { border-color: rgba(233,143,40,0.5); color: var(--pa-warning); background: var(--pa-warning-bg); }
.doc-pill--err  { border-color: rgba(211,47,47,0.5);  color: var(--pa-error);   background: var(--pa-error-bg); }

/* Status dot + label — status is coloured text, never a filled badge. */
.pa-status { display: inline-flex; align-items: center; gap: 7px; font-family: var(--pa-font-sans); font-size: 12.5px; }
.pa-status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: 0 0 auto; }
.pa-status--on  { color: var(--pa-success); }
.pa-status--off { color: var(--pa-ink-4); }

/* Avatars — initials on primary-050. Green is the signed-in user only. */
.pa-avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--pa-primary-050);
  color: var(--pa-primary);
  font-family: var(--pa-font-display);
  font-weight: 600;
  font-size: 12px;
  flex: 0 0 auto;
}
.pa-avatar--overflow { background: var(--pa-line-2); color: var(--pa-ink-3); font-family: var(--pa-font-sans); font-size: 11px; }
.pa-avatar--lg { width: 78px; height: 78px; font-size: 24px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--pa-avatar-green); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-family: var(--pa-font-sans); font-weight: 500; font-size: 12px; flex: 0 0 auto; }

/* ================= Fields ======================================
   Floating label: on the baseline when empty, rising 24px and
   scaling to 11.5px once focused or filled. Focus is black —
   the underline is structure, not an action. `.vf` in
   _vuetify-inputs.css is the interactive Vuetify-accurate build;
   `.pa-field` is the static documentation form of the same thing. */
.pa-field { position: relative; padding-top: 18px; width: 100%; font-family: var(--pa-font-sans); }
.pa-field__label {
  position: absolute;
  left: 0; top: 18px;
  padding: 6px 0;
  margin: 0;
  font-size: 13px;
  line-height: 19px;
  color: var(--pa-ink-3);
  pointer-events: none;
  transform-origin: left top;
  transition: transform 150ms cubic-bezier(.4,0,.2,1), color 150ms cubic-bezier(.4,0,.2,1);
}
.pa-field:where(:focus-within) > .pa-field__label,
.pa-field:where(:has(.pa-field__input:not(:placeholder-shown))) > .pa-field__label,
.pa-field:where(:has(> div:not(.pa-field__hint))) > .pa-field__label,
.pa-field--filled > .pa-field__label { transform: translateY(-24px) scale(0.885); }
.pa-field:focus-within > .pa-field__label { color: var(--pa-field-focus); }
.pa-field__input {
  width: 100%;
  box-sizing: border-box;
  border: none;
  border-bottom: 1px solid var(--pa-field-line);
  padding: 6px 0;
  font-family: var(--pa-font-display);
  font-size: 13.5px;
  line-height: 20px;
  color: var(--pa-ink);
  background: transparent;
  outline: none;
  transition: border-color 150ms cubic-bezier(.4,0,.2,1);
}
.pa-field__input::placeholder { color: transparent; }
.pa-field__input:focus { border-bottom: 2px solid var(--pa-field-focus); padding-bottom: 5px; caret-color: var(--pa-field-focus); }
/* Boxed search and filter inputs may show a real placeholder. */
.pa-field--hasplaceholder .pa-field__input::placeholder { color: var(--pa-ink-6); }
.pa-field--error .pa-field__input { border-bottom-color: var(--pa-error); }
.pa-field--error > .pa-field__label, .pa-field--error:focus-within > .pa-field__label { color: var(--pa-error); }
.pa-field--error .pa-field__hint { color: var(--pa-error); }
/* Read-only keeps the underline but switches it to dashed. */
.pa-field--disabled .pa-field__input { border-bottom-style: dashed; color: var(--pa-ink-7); }
.pa-field__hint { font-size: 12px; line-height: 18px; color: var(--pa-ink-3); padding-top: 6px; }
/* Trailing affordance row (select chevron, date, time, chips). */
.pa-field__control { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--pa-field-line); padding: 6px 0; }
.pa-field__control i { font-size: 19px; color: var(--pa-ink-2); }
.pa-field__value { flex: 1; font-family: var(--pa-font-display); font-size: 13.5px; color: var(--pa-ink); }
.pa-field__value--empty { color: var(--pa-ink-6); }

/* Boxed search — search and table filters only. */
.search { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; background: #fff; border: 1px solid var(--pa-divider); border-radius: var(--pa-radius-sm); width: 280px; box-sizing: border-box; }
.search input { border: none; outline: none; background: transparent; font-family: var(--pa-font-display); font-size: 13px; flex: 1; min-width: 0; color: var(--pa-ink); }
.search input::placeholder { color: var(--pa-ink-6); }

/* ================= Surfaces ==================================== */
.pa-card { background: #fff; border: 1px solid var(--pa-divider); border-radius: var(--pa-radius-sm); box-shadow: var(--pa-elev-1); }
.pa-card--form { box-shadow: var(--pa-elev-card); }
.pa-card--raised { box-shadow: var(--pa-elev-raised); }

/* Section band — divides one card into labelled groups.
   Related groups become bands inside a card, never new cards. */
.pa-band {
  background: var(--pa-band);
  padding: 13px 32px;
  font-family: var(--pa-font-sans);
  font-weight: 400;
  font-size: 18px;
  line-height: 26px;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  color: var(--pa-ink);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.pa-band--sm { padding: 12px 16px; font-size: 16px; }
.pa-card__body { padding: 26px 32px 28px; display: flex; flex-direction: column; gap: 24px; }

/* Inline sub-panel — primary-050, opens directly under its trigger. */
.pa-subpanel { background: var(--pa-primary-050); border-top: 1px solid var(--pa-line); padding: 16px; }

/* Rule callout — the documentation voice, also used for inline guidance. */
.pa-rules { background: var(--pa-primary-050); border-radius: var(--pa-radius-sm); padding: 16px 18px; }
.pa-rules ul { margin: 8px 0 0; padding-left: 18px; font-family: var(--pa-font-sans); font-size: 12.5px; line-height: 19px; color: var(--pa-ink-2); }

/* Dropzone — the only dashed border in the product. */
.pa-dropzone { border: 2px dashed var(--pa-primary); border-radius: var(--pa-radius-lg); padding: 34px 20px; text-align: center; background: #fff; font-family: var(--pa-font-sans); font-size: 13.5px; }
.pa-dropzone__hint { font-size: 12.5px; color: var(--pa-ink-3); margin-top: 5px; }
.pa-file-row { display: flex; align-items: center; gap: 12px; border: 1px solid var(--pa-primary); border-radius: var(--pa-radius-sm); padding: 10px 14px; font-family: var(--pa-font-sans); }

/* Empty / not-migrated state. */
.pa-empty { border: 1px solid var(--pa-line); border-radius: var(--pa-radius-sm); display: flex; flex-direction: column; align-items: center; padding: 40px 24px; text-align: center; font-family: var(--pa-font-sans); }
.pa-empty i { font-size: 48px; color: var(--pa-ink-7); }
.pa-empty__title { font-size: 18px; margin-top: 14px; color: var(--pa-ink); }
.pa-empty__body { font-size: 13.5px; line-height: 20px; color: var(--pa-ink-3); margin-top: 6px; max-width: 360px; }

/* ================= Tables ======================================
   Grid table for a bounded set inside a record — never paginated.
   List table for open-ended index screens. */
.pa-table { border: 1px solid var(--pa-divider); border-radius: var(--pa-radius-sm); overflow: hidden; font-family: var(--pa-font-sans); }
.pa-table__head, .pa-table__row { display: grid; align-items: center; }
.pa-table__head { background: var(--pa-band); font-size: 12px; font-weight: 500; color: var(--pa-ink); }
.pa-table__head > * { padding: 11px 16px; border-right: 1px solid var(--pa-divider); }
.pa-table__head > *:last-child { border-right: none; }
.pa-table__row { border-top: 1px solid var(--pa-line); font-size: 13px; }
.pa-table__row > * { padding: 12px 16px; border-right: 1px solid var(--pa-line); }
.pa-table__row > *:last-child { border-right: none; }
.pa-table__row:hover { background: var(--pa-primary-04a); }

.pa-ltable { width: 100%; border-collapse: collapse; font-family: var(--pa-font-sans); }
.pa-ltable th { padding: 14px; text-align: left; font-size: 14px; font-weight: 400; color: var(--pa-ink); white-space: nowrap; border-top: 1px solid var(--pa-rule); border-bottom: 1px solid var(--pa-rule); }
.pa-ltable th.sortable { cursor: pointer; user-select: none; }
.pa-ltable td { padding: 14px; font-size: 13.5px; color: var(--pa-ink); border-bottom: 1px solid var(--pa-line); vertical-align: top; }
.pa-ltable tbody tr:hover { background: rgba(33,33,33,0.02); }
.pa-ltable .num { color: var(--pa-ink-2); }
.pa-ltable .desc { font-size: 12.5px; line-height: 18px; color: var(--pa-ink-2); text-wrap: pretty; }
.pa-ltable .acts { text-align: right; white-space: nowrap; }

/* Table controls — repeat above and below a list table. */
.pa-tablebar { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 6px 0 10px; font-family: var(--pa-font-sans); font-size: 13px; color: var(--pa-ink-2); }
.pa-tablebar--footer { padding: 12px 0 0; border-top: 1px solid var(--pa-rule); }
.pa-tablebar select { height: 34px; border: 1px solid var(--pa-line); border-radius: var(--pa-radius-sm); background: #fff; font-family: var(--pa-font-sans); font-size: 13px; color: var(--pa-ink); padding: 0 8px; }
.pa-pager { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.pa-pager button { min-width: 30px; height: 30px; padding: 0 6px; border: none; border-radius: var(--pa-radius-sm); background: transparent; font-family: var(--pa-font-sans); font-size: 13px; color: var(--pa-ink-2); cursor: pointer; }
.pa-pager button:hover { background: rgba(33,33,33,0.06); }
.pa-pager button[aria-current="page"] { background: var(--pa-primary-12a); color: var(--pa-primary); font-weight: 500; }
.pa-pager button[disabled] { opacity: 0.3; pointer-events: none; }

/* ================= Toast ======================================= */
.pa-toast {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: var(--pa-radius-sm);
  font-family: var(--pa-font-sans);
  font-size: 14px;
  color: var(--pa-ink);
  background: #fff;
  border-left: 4px solid var(--pa-primary);
  box-shadow: var(--pa-elev-raised);
}
.pa-toast--success { border-left-color: var(--pa-success); }
.pa-toast--warning { border-left-color: var(--pa-warning); }
.pa-toast--error   { border-left-color: var(--pa-error); }
.pa-toast__icon { font-size: 20px; display: inline-flex; }
.pa-toast--success .pa-toast__icon { color: var(--pa-success); }
.pa-toast--warning .pa-toast__icon { color: var(--pa-warning); }
.pa-toast--error   .pa-toast__icon { color: var(--pa-error); }
.pa-toast--info    .pa-toast__icon { color: var(--pa-primary); }

/* ================= App chrome ================================== */
.topbar { height: 56px; background: #fff; border-bottom: 1px solid var(--pa-divider); display: flex; align-items: center; padding: 0 24px; gap: 16px; }
.topbar__btn { width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--pa-ink-2); cursor: pointer; border: none; background: transparent; }
.topbar__btn:hover { background: rgba(0,0,0,0.04); }

.sb { width: 230px; flex-shrink: 0; background: var(--pa-sidebar-bg); color: #fff; font-family: var(--pa-font-sans); display: flex; flex-direction: column; }
.sb__head { padding: 18px 14px; display: flex; align-items: center; justify-content: space-between; }
.sb__brand { font-weight: 500; font-size: 19px; letter-spacing: 1px; color: #fff; }
.sb__brand span { color: var(--pa-aqua-500); }
.sb__collapse { color: rgba(255,255,255,0.6); cursor: pointer; }
.sb__section { padding: 4px 0; }
.sb__item { display: flex; align-items: center; gap: 14px; padding: 12px 18px; font-size: 14px; color: rgba(255,255,255,0.9); cursor: pointer; user-select: none; }
.sb__item i { font-size: 20px; }
.sb__item__chev { margin-left: auto; font-size: 18px; opacity: 0.6; }
.sb__item--active { background: var(--pa-sidebar-active); }
.sb__item:hover:not(.sb__item--active) { background: rgba(255,255,255,0.06); }
.sb__sub { padding: 2px 0 8px; }
.sb__sub-item { display: flex; padding: 8px 18px 8px 54px; font-size: 13px; color: rgba(255,255,255,0.72); cursor: pointer; }
.sb__sub-item--active { background: var(--pa-sidebar-active); color: #fff; }
.sb__sub-item:hover:not(.sb__sub-item--active) { color: #fff; }

/* Tab bar — full-width primary blue, equal-width tabs, no underline. */
.pa-tabs { display: flex; align-items: stretch; height: 48px; background: var(--pa-primary); color: #fff; }
.pa-tabs--sm { height: 44px; }
.pa-tabs__btn {
  flex: 1;
  height: 100%;
  padding: 0 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--pa-font-sans);
  font-weight: 500;
  font-size: 13px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #fff;
  background: transparent;
  border: none;
  cursor: pointer;
}
.pa-tabs__btn--active { background: var(--pa-primary-700); }
.pa-tabs__btn:hover:not(.pa-tabs__btn--active) { background: rgba(255,255,255,0.06); }

/* Breadcrumb — sits below the tab bar, never above. */
.pa-crumb { font-family: var(--pa-font-sans); font-size: 13px; line-height: 18px; color: var(--pa-ink-3); }
.pa-crumb a { color: var(--pa-primary); }

/* Modal scrim */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; padding: 24px; }


/* ===== preview/_vuetify-inputs.css ===== */
/* ============================================================
   Shared Vuetify-style input base — underlined variant.
   Used by fields-*.html cards (text field, textarea, combobox,
   radio, checkbox). The active accent is #000 per brand spec.
   ============================================================ */

.vf {
  position: relative;
  padding-top: 18px;
  font-family: var(--pa-font-sans);
  color: var(--pa-ink);
}

.vf__input,
.vf__textarea {
  width: 100%;
  box-sizing: border-box;
  border: 0;
  background: transparent;
  padding: 4px 0 6px;
  font: inherit;
  font-size: 14px;
  line-height: 20px;
  color: var(--pa-ink);
  outline: none;
  border-bottom: 1px solid rgba(0, 0, 0, 0.42);
  transition: border-color 200ms cubic-bezier(.4, 0, .2, 1);
}
.vf__textarea {
  resize: vertical;
  min-height: 80px;
  font-family: inherit;
}
.vf__input::placeholder,
.vf__textarea::placeholder { color: rgba(0, 0, 0, 0.38); }
.vf__input:placeholder-shown:not(:focus)::placeholder,
.vf__textarea:placeholder-shown:not(:focus)::placeholder { color: transparent; }

.vf__label {
  position: absolute;
  left: 0;
  top: 18px;
  font-size: 14px;
  line-height: 20px;
  color: rgba(0, 0, 0, 0.6);
  pointer-events: none;
  transform-origin: top left;
  transition: transform 200ms cubic-bezier(.4, 0, .2, 1),
              color 200ms cubic-bezier(.4, 0, .2, 1);
}
.vf__input:focus ~ .vf__label,
.vf__input:not(:placeholder-shown) ~ .vf__label,
.vf__textarea:focus ~ .vf__label,
.vf__textarea:not(:placeholder-shown) ~ .vf__label {
  transform: translateY(-18px) scale(0.857);
}
.vf__input:focus,
.vf__textarea:focus,
.vf--focused .vf__input,
.vf--focused .vf__textarea {
  border-bottom: 2px solid #000;
  padding-bottom: 5px;
  caret-color: #000;
}
.vf__input:focus ~ .vf__label,
.vf__textarea:focus ~ .vf__label,
.vf--focused .vf__label {
  transform: translateY(-18px) scale(0.857);
  color: #000;
}

.vf__messages {
  min-height: 14px;
  padding: 4px 0 0;
  font-size: 12px;
  line-height: 12px;
  color: rgba(0, 0, 0, 0.6);
}
.vf__counter { float: right; font-size: 12px; color: rgba(0, 0, 0, 0.6); padding-top: 4px; }

/* Error */
.vf--error .vf__input,
.vf--error .vf__textarea,
.vf--error .vf__input:focus,
.vf--error .vf__textarea:focus { border-bottom-color: var(--pa-error); }
.vf--error .vf__label,
.vf--error .vf__input:focus ~ .vf__label,
.vf--error .vf__textarea:focus ~ .vf__label { color: var(--pa-error); }
.vf--error .vf__messages { color: var(--pa-error); }

/* Disabled */
.vf--disabled .vf__input,
.vf--disabled .vf__textarea {
  color: rgba(0, 0, 0, 0.38);
  border-bottom-style: dotted;
  border-bottom-color: rgba(0, 0, 0, 0.38);
  pointer-events: none;
}
.vf--disabled .vf__label { color: rgba(0, 0, 0, 0.38); }

/* Trailing icon (eye, dropdown chevron, etc.)
   Sits at the input baseline, clear of the underline. */
.vf__input--with-icon,
.vf__textarea--with-icon { padding-right: 28px; }
.vf__icon {
  position: absolute;
  right: 0;
  top: 22px;
  width: 20px;
  height: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: rgba(0, 0, 0, 0.6);
  cursor: pointer;
  background: none;
  border: 0;
  padding: 0;
}
.vf__icon:hover { color: #000; }

/* ============================================================
   Selection controls — radio + checkbox
   ============================================================ */

.vsel {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
  font-family: var(--pa-font-sans);
  font-size: 14px;
  line-height: 20px;
  color: var(--pa-ink);
  cursor: pointer;
  user-select: none;
}
.vsel input { position: absolute; opacity: 0; pointer-events: none; }
.vsel__box {
  position: relative;
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: rgba(0, 0, 0, 0.6);
  transition: color 150ms cubic-bezier(.4, 0, .2, 1);
}
.vsel__box i { font-size: 20px; }
.vsel:hover .vsel__box { color: #000; }
.vsel input:checked + .vsel__box { color: #000; }
.vsel input:disabled ~ .vsel__box,
.vsel--disabled .vsel__box { color: rgba(0, 0, 0, 0.26) !important; }
.vsel--disabled,
.vsel input:disabled ~ .vsel__label { color: rgba(0, 0, 0, 0.38); pointer-events: none; }

/* Radio / checkbox groups */
.vgroup { display: flex; gap: 4px 24px; flex-wrap: wrap; }
.vgroup--inline { flex-direction: row; align-items: center; }
.vgroup--stacked { flex-direction: column; gap: 2px; }

.vgroup__legend {
  font-size: 12px;
  color: rgba(0, 0, 0, 0.6);
  margin-bottom: 4px;
}

/* ============================================================
   Switch / Toggle — Vuetify v-switch default variant
   Thin track with a larger thumb that protrudes above/below.
   Off: grey track + white thumb.
   On:  light-green tinted track + full success-green thumb.
   ============================================================ */
.vsw {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 6px 0;
  font-family: var(--pa-font-sans);
  font-size: 14px;
  line-height: 20px;
  color: var(--pa-ink);
  cursor: pointer;
  user-select: none;
  position: relative;
}
.vsw input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
  inset: 0;
}
.vsw__track {
  position: relative;
  width: 36px;
  height: 14px;
  background: rgba(0, 0, 0, 0.38);
  border-radius: 7px;
  flex-shrink: 0;
  transition: background 200ms cubic-bezier(.4, 0, .2, 1);
}
.vsw__thumb {
  position: absolute;
  top: -3px;          /* protrudes above the track */
  left: -1px;         /* protrudes slightly past the track at rest */
  width: 20px;
  height: 20px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 2px 1px -1px rgba(0,0,0,0.2),
              0 1px 1px 0 rgba(0,0,0,0.14),
              0 1px 3px 0 rgba(0,0,0,0.12);
  transition: transform 200ms cubic-bezier(.4, 0, .2, 1),
              background 200ms cubic-bezier(.4, 0, .2, 1);
}
.vsw input:checked + .vsw__track { background: rgba(46, 125, 50, 0.5); }
.vsw input:checked + .vsw__track .vsw__thumb {
  transform: translateX(18px);
  background: var(--pa-success);
}
.vsw:hover .vsw__track { background: rgba(0, 0, 0, 0.5); }
.vsw:hover input:checked + .vsw__track { background: rgba(46, 125, 50, 0.6); }

.vsw input:disabled + .vsw__track,
.vsw--disabled .vsw__track { background: rgba(0, 0, 0, 0.18) !important; }
.vsw input:disabled:checked + .vsw__track,
.vsw--disabled input:checked + .vsw__track { background: rgba(46, 125, 50, 0.28) !important; }
.vsw input:disabled:checked + .vsw__track .vsw__thumb,
.vsw--disabled input:checked + .vsw__track .vsw__thumb { background: rgba(46, 125, 50, 0.6) !important; }
.vsw input:disabled ~ .vsw__label,
.vsw--disabled { color: rgba(0, 0, 0, 0.38); pointer-events: none; }


/* ===== ui_kits/admin/app.css ===== */
/* PrimeAdmin 3 Admin Console — UI kit sandbox styles */

html, body, #root { height: 100%; margin: 0; }
body {
  background: var(--pa-paper);
  font-family: var(--pa-font-sans);
  color: var(--pa-ink);
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }

/* ---------- App shell ---------- */
.app { display: flex; min-height: 100vh; }
.app__main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: 56px;
  background: #fff;
  border-bottom: 1px solid var(--pa-divider);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
}
.topbar .search { width: auto; }
.topbar .search input { flex: 1; }
.topbar__btn {
  width: 36px; height: 36px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--pa-ink-2); cursor: pointer; border: none; background: transparent;
}
.topbar__btn:hover { background: rgba(0,0,0,0.04); }
.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--pa-avatar-green);
  color: #fff;
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 500; font-size: 12px;
}

/* ---------- Tabs (inset to match column) ---------- */
.app__main .pa-tabs { margin: 0 16px; }

/* ---------- Page band ---------- */
.page-band {
  background: #fff;
  padding: 18px 16px 12px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}
.page-band__left { flex: 1; }
.page-band__crumb {
  font-family: var(--pa-font-sans);
  font-size: 11px;
  letter-spacing: 0.05em;
  color: var(--pa-ink-3);
  text-transform: uppercase;
}
.page-band__title {
  font-family: var(--pa-font-sans);
  font-size: 26px;
  letter-spacing: 1.3px;
  color: var(--pa-primary);
  font-weight: 400;
  margin: 0;
  text-transform: uppercase;
}
.page-band__row {
  display: flex; align-items: center; gap: 16px;
  margin-top: 14px;
}

/* ---------- Search ---------- */
.search {
  display: inline-flex; align-items: center; gap: 8px;
  height: 36px; padding: 0 12px;
  background: #fff;
  border: 1px solid var(--pa-divider);
  border-radius: 4px;
  width: 280px;
}
.search input {
  border: none; outline: none; background: transparent;
  font-family: var(--pa-font-display); font-size: 13px;
  flex: 1; color: var(--pa-ink);
}

/* ---------- Content ---------- */
.content { padding: 24px 16px; background: #fff; flex: 1; }

.section-h2 {
  font-family: var(--pa-font-sans);
  font-size: 20px;
  font-weight: 500;
  color: var(--pa-primary-500);
  margin: 0 0 12px;
}

/* ---------- Faculty grid ---------- */
.faculty-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }

.f-card {
  background: #fff;
  border: 1px solid var(--pa-divider);
  border-radius: 8px;
  box-shadow: var(--pa-elev-card);
  padding: 16px;
  display: flex;
  gap: 16px;
}
.f-card__photo {
  width: 78px; height: 78px; border-radius: 50%;
  flex-shrink: 0; background-size: cover; background-position: center;
}
.f-card__name { font-size: 14px; font-weight: 500; color: var(--pa-ink); }
.f-card__title { font-size: 11px; color: var(--pa-ink-3); line-height: 16px; margin-top: 4px; }
.f-card__chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.f-card__docs {
  display: flex; gap: 6px; margin-top: 12px;
  border-top: 1px solid var(--pa-line);
  padding-top: 10px;
}
.doc-pill {
  display: inline-flex; align-items: center; gap: 4px;
  height: 22px; padding: 0 8px; border-radius: 11px;
  font-size: 10px; font-weight: 500;
  background: var(--pa-line); color: var(--pa-ink-3);
  white-space: nowrap;
}
.doc-pill--ok { background: var(--pa-success-bg); color: var(--pa-success); }
.doc-pill--warn { background: var(--pa-warning-bg); color: var(--pa-warning); }
.doc-pill--err { background: var(--pa-error-bg); color: var(--pa-error); }

/* ---------- Filter row ---------- */
.filter-row {
  display: flex; gap: 8px; align-items: center;
  margin-bottom: 16px; flex-wrap: wrap;
}

/* ---------- Sidebar nav (full) ---------- */
.sb {
  width: 230px;
  background: var(--pa-sidebar-bg);
  color: #fff;
  font-family: var(--pa-font-sans);
  flex-shrink: 0;
  display: flex; flex-direction: column;
}
.sb__head { padding: 18px 14px; display: flex; align-items: center; justify-content: space-between; }
.sb__logo { height: 22px; display: block; }
.sb__collapse { color: rgba(255,255,255,0.6); cursor: pointer; }
.sb__section { padding: 4px 0; }
.sb__item {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 18px;
  font-size: 14px;
  color: #fff;
  cursor: pointer;
  user-select: none;
}
.sb__item i { font-size: 20px; }
.sb__item__chev { margin-left: auto; font-size: 18px; opacity: 0.6; }
.sb__item--active { background: var(--pa-sidebar-active); }
.sb__item:hover:not(.sb__item--active) { background: rgba(255,255,255,0.06); }
.sb__sub { padding: 2px 0 8px; }
.sb__sub-item { display: flex; padding: 8px 18px 8px 54px; font-size: 13px; color: rgba(255,255,255,0.72); cursor: pointer; }
.sb__sub-item--active { background: var(--pa-sidebar-active); color: #fff; }
.sb__sub-item:hover:not(.sb__sub-item--active) { color: #fff; }
.sb__foot {
  margin-top: auto;
  padding: 14px 18px;
  border-top: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; gap: 10px;
  font-size: 12px; color: rgba(255,255,255,0.6);
}

/* ---------- Detail screen ---------- */
.detail-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; align-items: start; }
.panel {
  background: #fff;
  border: 1px solid var(--pa-divider);
  border-radius: 8px;
  padding: 20px 24px;
}
.kv { display: grid; grid-template-columns: 140px 1fr; row-gap: 10px; column-gap: 12px; }
.kv__k { font-size: 12px; color: var(--pa-ink-3); letter-spacing: 0.04em; text-transform: uppercase; padding-top: 2px; }
.kv__v { font-size: 13px; color: var(--pa-ink); }

/* ---------- Inbox / table ---------- */
.t-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid var(--pa-divider); }
.t-table th, .t-table td { padding: 12px 16px; text-align: left; font-size: 13px; }
.t-table thead { background: var(--pa-primary-600); color: #fff; }
.t-table th { font-weight: 500; font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; }
.t-table tbody tr { border-top: 1px solid var(--pa-line); }
.t-table tbody tr:hover { background: var(--pa-primary-04a); }
.t-table .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
.t-table .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* ---------- Empty state ---------- */
.empty {
  text-align: center; padding: 48px 24px;
  color: var(--pa-ink-3);
}
.empty i { font-size: 48px; color: var(--pa-ink-7); }
.empty__title { font-size: 16px; color: var(--pa-ink); margin-top: 12px; }

/* ---------- Notifications board ---------- */
.board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; border-top: 1px solid var(--pa-divider); padding-top: 16px; }
.board__col { border-right: 1px solid var(--pa-divider); padding-right: 16px; min-height: 240px; }
.board__col:last-child { border-right: none; }
.board__head { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--pa-ink-6); padding: 0 0 12px; text-align: center; font-weight: 500; }

.rmd { border: 1px solid var(--pa-divider); border-radius: 4px; background: #fff; margin-bottom: 12px; overflow: hidden; }
.rmd__band { color: #fff; font-size: 12px; font-weight: 700; letter-spacing: 0.05em; padding: 8px 14px; }
.rmd__body { padding: 12px 14px; }
.rmd__when { font-size: 11px; color: var(--pa-ink-3); margin-bottom: 6px; }
.rmd__text { font-size: 13px; color: var(--pa-ink); line-height: 18px; }
.rmd__foot { display: flex; align-items: center; gap: 4px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--pa-line); }

/* ===== Page ===== */
*{box-sizing:border-box;}
  html,body{margin:0;background:#fff;}
  body{font-family:var(--pa-font-sans);color:var(--pa-ink);-webkit-font-smoothing:antialiased;}
  a{color:var(--pa-primary);text-decoration:none;}
  a:hover{color:var(--pa-primary-700);text-decoration:underline;}
  input,textarea,button{font-family:inherit;}

  .vf__input:disabled,.vf__textarea:disabled{color:var(--pa-ink);border-bottom-style:dashed;border-bottom-color:rgba(0,0,0,0.22);pointer-events:none;opacity:1;}
  .vf__input:disabled ~ .vf__label,.vf__textarea:disabled ~ .vf__label{color:var(--pa-ink-3);}
  .vf__textarea{min-height:56px;}

  .pub-rt p{margin:0 0 10px;}
  .pub-rt p:last-child{margin-bottom:0;}
  .pub-rt ul,.pub-rt ol{margin:0 0 10px;padding-left:22px;}
  .pub-rt li{margin:0 0 6px;}

  a.pa-btn-rail,a.pa-btn-rail:hover,a.pa-btn-rail:visited{color:#fff;text-decoration:none;}

  .cmb-opt{display:block;width:100%;text-align:left;border:none;background:transparent;cursor:pointer;padding:9px 16px;font-family:var(--pa-font-sans);font-size:13.5px;color:var(--pa-ink);}
  .cmb-opt:hover{background:var(--pa-primary-04a);}
  .cmb-x{border:none;background:transparent;cursor:pointer;padding:0;display:inline-flex;align-items:center;color:var(--pa-ink-3);}
  .cmb-x:hover{color:var(--pa-ink);}

  @keyframes toastIn{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}
  @keyframes scrimIn{from{opacity:0;}to{opacity:1;}}
  @keyframes modalIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes drawerIn{from{transform:translateX(48px);opacity:0;}to{transform:none;opacity:1;}}
  @media (max-width:1180px){.pd-grid{grid-template-columns:minmax(0,1fr) !important;}}

  .fac-iconbtn{border:none;background:transparent;cursor:pointer;width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;transition:background 150ms;}
  .fac-iconbtn:hover{background:rgba(33,33,33,0.06);}
  .fac-role{display:inline-flex;align-items:center;padding:6px 14px;border-radius:var(--pa-radius-pill);background:var(--pa-primary);color:#fff;font-family:var(--pa-font-display);font-weight:700;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;}
  .fac-status{display:inline-flex;align-items:center;padding:4px 12px;border-radius:var(--pa-radius-pill);font-family:var(--pa-font-display);font-weight:700;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:#fff;}
  .fac-tool{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--pa-divider);background:#fff;border-radius:var(--pa-radius-sm);padding:11px 14px;cursor:pointer;font-family:var(--pa-font-sans);font-size:12.5px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--pa-ink);text-align:left;transition:background 150ms,border-color 150ms;}
  .fac-tool:hover{background:var(--pa-primary-050);border-color:rgba(25,118,210,0.35);}

  .rt-tool{width:28px;height:28px;border:none;background:transparent;border-radius:4px;cursor:pointer;color:var(--pa-ink-2);display:inline-flex;align-items:center;justify-content:center;transition:background 150ms;}
  .rt-tool:hover{background:rgba(33,33,33,0.06);}

  .fx-act{border:none;background:transparent;cursor:pointer;padding:4px;border-radius:4px;line-height:0;}
  .fx-act:hover{background:rgba(33,33,33,0.06);}
  .fx-opt{padding:9px 13px;font-family:var(--pa-font-sans);font-size:13px;color:var(--pa-ink);cursor:pointer;}
  .fx-opt:hover{background:rgba(33,33,33,0.04);}
  .fx-opt--on{color:var(--pa-primary);background:rgba(25,118,210,0.08);}

  .afp-panel{animation:drawerIn 260ms cubic-bezier(.4,0,.2,1);}
  .afp-iconbtn{border:none;background:transparent;cursor:pointer;color:var(--pa-ink);width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;transition:background 150ms;}
  .afp-iconbtn:hover{background:rgba(33,33,33,0.06);}
  .afp-search{position:relative;}
  .afp-search > input{width:100%;height:40px;border:1px solid var(--pa-divider);border-radius:var(--pa-radius-sm);padding:0 38px 0 14px;font-family:var(--pa-font-display);font-size:13.5px;color:var(--pa-ink);background:#fff;outline:none;box-shadow:var(--pa-elev-search);transition:border-color 150ms;}
  .afp-search > input:focus{border-color:var(--pa-ink-4);}
  .afp-search > i{position:absolute;right:12px;top:10px;font-size:20px;color:var(--pa-ink-4);pointer-events:none;}
  .afp-row{display:grid;grid-template-columns:130px minmax(220px,1.2fr) minmax(220px,1.3fr) minmax(200px,1.2fr);gap:20px;padding:18px 24px;border-top:1px solid #EEEEEE;align-items:start;transition:background 150ms;}
  .afp-row:hover{background:rgba(25,118,210,0.035);}
  .afp-page{border:none;background:transparent;cursor:pointer;min-width:30px;height:30px;border-radius:var(--pa-radius-sm);font-family:var(--pa-font-sans);font-size:13px;color:var(--pa-ink-2);transition:background 150ms;}
  .afp-page:hover{background:rgba(33,33,33,0.06);}
  .afp-page--on{background:#EEEEEE;color:var(--pa-ink);font-weight:500;}

  .act-link{text-decoration:none;}
  .act-link:hover{text-decoration:underline;}
  .act-link--title{color:var(--pa-ink);}
  .act-link--title:hover{color:var(--pa-primary);}
  .act-link--child{color:var(--pa-ink-3);}
  .act-link--child:hover{color:var(--pa-primary);}
.pres-btn{display:inline-flex;align-items:center;gap:10px;height:36px;padding:0 8px 0 5px;border-radius:18px;cursor:pointer;background:transparent;border:none;outline:none;transition:background 150ms cubic-bezier(.4,0,.2,1);}
.pres-btn:hover,.pres-btn--open{background:var(--pa-primary-04a);}
.menu-row:hover{background:var(--pa-primary-04a) !important;}
.vsel[role="checkbox"]:focus-visible{outline:2px solid var(--pa-primary);outline-offset:2px;border-radius:2px;}

var BASE_CONTENT = {
  commercialSupport: "<p>This activity is supported by an educational grant from Novartis Pharmaceuticals Corporation.</p>",
  intendedAudience: "<p>Hematologists along with their clinical teams, including NPs/PAs, pharmacists, nurses, and case managers caring for patients with PNH.</p>",
  componentsOverview: "<p><u>2-Part Multi-Accredited Live National Webinar Series (Two (2) 1.0-hour Webinars)</u></p><p>Each of the live webinars will be led by 2 hematology specialists with demonstrated expertise in PNH and facilitated by a clinical moderator. At pivotal points in the webinars, the faculty will introduce insightful polling and discussion questions. The audience will be able to submit questions, which will be triaged by the clinical moderator to the faculty experts for their responses.</p><p>As part of the first webinar, PRIME will design a 1.5-minute 2D animation video highlighting the novel mechanism of action of complement inhibitors in the coagulation pathway and their clinical implications for real-world care.</p><p><u>Downloadable Point-of-Care Resource: PNH Precision Care Guide</u></p><p>PRIME will develop a downloadable PNH Precision Care Guide highlighting concise key points for quick reference on vaccinations, treatment adherence, breakthrough hemolysis, and clinical decision-making. The succinct PDF resource will be introduced in the live webinars and available alongside the enduring webcasts.</p><p><u>Two (2) 1.0-hour Multi-Accredited On-Demand Enduring Webcasts</u></p><p>PRIME will record the live webinars to produce two (2) 1.0-hour multi-accredited, on-demand, enduring webcasts including polling questions from the initial live webinars. The webcasts will be widely disseminated in online and mobile formats through the PRIME Network, MedPage Today (MPT), ASCO Reading Room, American Society of Hematology (ASH) and PatientPoint.</p>",
  learningObjectives: "<ul><li>Compare and contrast current and emerging treatments for paroxysmal nocturnal hemoglobinuria (PNH) based on efficacy, safety, and route of administration</li><li>Explain how new pathways and unique mechanisms of action can address unmet needs in patients with PNH</li><li>Describe the recommended approaches to treatment selection in patients with PNH based on lines of therapy</li><li>Select appropriate treatments for patients with PNH across lines of therapy, based on guidelines and expert recommendations</li><li>Apply best practices to ensure PNH patient adherence to complement inhibitor therapy</li><li>Follow vaccination requirements to minimize risk of infectious complications in patients with PNH on complement inhibitor therapy</li><li>Enact expert recommendations on management practices to minimize or prevent breakthrough hemolysis and its complications</li></ul>",
  agenda: "<p><u>Webinar 1 (1.0-hour): Changing Paradigms in Paroxysmal Nocturnal Hemoglobinuria (PNH): Understanding New Pathways, Clinical Evidence, and Practice Guidelines</u></p><p>I. New pathways and unique mechanisms</p><p>o 2D Animation</p><p>II. Comparing current and emerging treatments for PNH: efficacy, safety, and route of administration</p><p>III. Guideline-recommended approaches to treatment selection in PNH</p><p>IV. Treatment decision-making: evaluating a therapeutic switch strategy</p><p>V. Audience Q&amp;A</p><p><u>Webinar 2 (1.0-hour): Optimizing PNH Care: Strategies to Enhance Treatment Adherence and Ongoing Patient Management</u></p><p>I. Best practices to ensure PNH patient adherence to complement inhibitor therapy</p><p>o Patient Case Focus: Adherence &amp; Missed Doses</p><p>II. Minimizing risk of infectious complications in patients with PNH on complement inhibitor therapy</p><p>o Patient Case Focus: Urgent Therapy Start Before Vaccine Completion</p><p>III. Proactive approaches for recognition and management of breakthrough hemolysis</p><p>o Patient Case Focus: Breakthrough Bleeding</p><p>IV. Introduction of the PNH Precision Care Guide</p><p>V. Audience Q&amp;A</p>",
  gaps: "<ul><li>Hematology providers lack a clear understanding of the roles and limitations of terminal complement inhibitors in paroxysmal nocturnal hemoglobinuria (PNH), leading to suboptimal management of breakthrough intravascular hemolysis (IVH) and C3-mediated extravascular hemolysis (EVH)</li><li>Clinicians struggle to identify appropriate treatments for patients with PNH, particularly when considering treatments with novel pathways and mechanisms of action</li><li>Many providers are unaware of their mechanisms of action, safety profiles, latest efficacy data, and how they differ from traditional anti-C5 therapies</li><li>Few healthcare providers feel confidence in differentiating among available and emerging proximal complement inhibitors based on mechanisms of action, safety, efficacy, and route of administration</li><li>Care teams lack clear strategies for managing patients who experience ongoing or breakthrough hemolysis, and for aligning therapy choices with patient preferences for treatment convenience and administration</li><li>Hematology providers report limited confidence in developing and adjusting comprehensive care plans for patients with PNH, particularly those with complex disease manifestations or inadequate response to initial therapy</li></ul>",
  needs: "<p>Hematologists and their clinical teams are essential to the evaluation, treatment, and ongoing management of patients with PNH and therefore, should be well-educated on the diverse treatment options, the unique roles of terminal versus proximal complement inhibitors, and the nuances of shared decision-making that leverages patient preferences to inform the selection of treatments to achieve effective control of hemolysis and reduce the risk of serious complications such as thrombosis. While the development of proximal complement inhibitors represents a significant advance in the field, critical gaps remain in provider awareness, knowledge, and competence regarding these therapies. Many providers are unfamiliar with how these inhibitors function and the clinical implications of their use, which may prevent patients from receiving optimal treatment focused on enhancing adherence and mitigating risks of treatment including infection. Moreover, many HCPs lack foundational knowledge of the disease itself, which may impact their ability to appropriately manage patients who exhibit signs and symptoms of BTH and EVH. Thus, there is a pressing need for targeted education on the new pathways and novel mechanisms of action represented by proximal complement inhibitors, clinical evidence supporting the use of these therapies, and the integration of the latest evidence into personalized management of PNH.</p>",
  designedToChange: "<p>This activity is designed to change learners' knowledge and competence in (1) new pathways and unique MOAs to address unmet needs in PNH, (2) clinical evidence on available complement inhibitor therapies, and (3) current guidelines for treatment selection and ongoing management. Furthermore, the program will guide HCPs in optimizing PNH treatment through (4) addressing adherence to ensure treatment benefit and quality of life, (5) recognizing and managing breakthrough hemolysis, and (6) applying vaccination requirements and infection risk mitigation strategies, altogether enhancing the clinical decision-making ability of HCPs to provide initial and ongoing care for patients with this rare blood disorder.</p>",
  scope: "<p>Interprofessional HCPs are involved in diagnostic, treatment, and management strategies that directly impact patients with PNH.</p>",
  format: "<p><u>Webinars</u></p><p>Live virtual activities allow clinicians to access timely and immediate educational content from multiple device options (desktop, tablet, mobile) from the clinic or other work setting.</p><p><u>Enduring Recordings</u></p><p>The online, enduring format for this initiative allows for busy clinicians to access educational content at one's convenience, from multiple device options (desktop, tablet, mobile) and permit self-paced, independent learning.</p>"

/* ============================ Helpers ============================ */

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function fmtSize(b) {
  if (b == null) return "";
  if (b >= 1048576) return (b / 1048576).toFixed(1) + " MB";
  if (b >= 1024) return (b / 1024).toFixed(1) + " KB";
  return b + " B";
}

function fileIcon(name) {
  var e = String(name).split(".").pop().toLowerCase();
  if (e === "pdf") return "mdi-file-pdf-box";
  if (e === "doc" || e === "docx") return "mdi-file-word-outline";
  if (e === "ppt" || e === "pptx") return "mdi-file-powerpoint-outline";
  if (["png","jpg","jpeg","gif","svg"].indexOf(e) > -1) return "mdi-file-image-outline";
  if (["mp4","mov","avi","webm"].indexOf(e) > -1) return "mdi-file-video-outline";
  return "mdi-file-outline";
}

function initials(n) {
  var parts = (n || "").replace(/,.*$/, "").split(" ").filter(Boolean);
  if (!parts.length) return "?";
  return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
}

function flash(msg) {
  clearTimeout(toastTimer);
  state.toast = msg;
  render();
  toastTimer = setTimeout(function () { state.toast = ""; render(); }, 4000);
}

function isEditing() { return state.mode === "edit"; }

function tabAllowsEdit() { return ["Activities", "Faculty", "Files"].indexOf(state.tab) === -1; }

function setBaseline() {
  baseline = JSON.stringify([state.f, state.leads, state.checks, state.supporters, state.content]);
}

function isDirty() {
  if (state.mode !== "edit" || !baseline) return false;
  return JSON.stringify([state.f, state.leads, state.checks, state.supporters, state.content]) !== baseline;
}

function requestTab(t) {
  if (t === state.tab) return;
  if (isDirty()) { state.pendingTab = t; state.openCombo = ""; render(); return; }
  state.tab = t; state.openCombo = ""; state.mode = "read"; state.presAlert = alertFor(t); render();
}

function selectBoxHTML(key, label, options, selected, opts) {
  opts = opts || {};
  var open = state.openSelect === key;
  var chips = opts.multi ? (selected || []) : [];
  var body;
  if (opts.multi) {
    body = chips.length
      ? chips.map(function (c) {
          return '<span style="display:inline-flex;align-items:center;gap:4px;background:rgba(25,118,210,0.12);color:var(--pa-primary);border-radius:var(--pa-radius-pill);padding:2px 7px 2px 11px;font-family:var(--pa-font-sans);font-size:11.5px;font-weight:500;max-width:100%">' +
            '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(c) + '</span>' +
            '<i class="mdi mdi-close" data-a="sel-pick" data-key="' + esc(key) + '" data-val="' + esc(c) + '" style="font-size:13px;cursor:pointer"></i></span>';
        }).join("")
      : '<span style="font-family:var(--pa-font-sans);font-size:13px;color:var(--pa-ink-6)">' + esc(label) + '</span>';
  } else {
    body = '<span style="font-family:var(--pa-font-sans);font-size:13px;color:' + (selected ? "var(--pa-ink)" : "var(--pa-ink-6)") + ';overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(selected || label) + '</span>';
  }

  var list = "";
  if (open) {
    var all = (opts.clearable ? [opts.clearLabel || "Unassigned"] : []).concat(options);
    list = '<div style="position:absolute;z-index:400;top:calc(100% + 2px);left:0;width:100%;max-height:260px;overflow-y:auto;background:#fff;border-radius:4px;box-shadow:var(--pa-elev-modal)">' +
      all.map(function (o) {
        var on = opts.multi ? chips.indexOf(o) > -1 : selected === o;
        return '<div class="fx-opt' + (on ? " fx-opt--on" : "") + '" data-a="sel-pick" data-key="' + esc(key) + '" data-val="' + esc(o) + '">' + esc(o) + '</div>';
      }).join("") + '</div>';
  }

  return '<div style="position:relative;width:100%">' +
    '<div data-a="sel-toggle" data-key="' + esc(key) + '" style="display:flex;align-items:center;gap:6px;min-height:38px;padding:5px 30px 5px 12px;border:1px solid ' + (open ? "var(--pa-primary)" : "var(--pa-ink-7)") + ';border-radius:4px;background:#fff;cursor:pointer;flex-wrap:wrap;position:relative">' +
      body +
      '<i class="mdi ' + (opts.search ? "mdi-magnify" : "mdi-menu-down") + '" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:' + (opts.search ? 18 : 22) + 'px;color:var(--pa-ink-3)"></i>' +
    '</div>' + list + '</div>';
}

function visibleFiles() {
  var q = (state.fileQ || "").toLowerCase();
  return state.files
    .filter(function (f) { return state.showArchived || !f.archived; })
    .filter(function (f) { return !q || f.name.toLowerCase().indexOf(q) > -1 || (f.display || "").toLowerCase().indexOf(q) > -1; })
    .filter(function (f) { return !state.fileCat || f.categories.indexOf(state.fileCat) > -1; })
    .filter(function (f) { return !state.fileStatus || f.status === state.fileStatus; });
}

function render() {
  var active = document.activeElement;
  var focusKey = active && active.getAttribute ? active.getAttribute("data-focus") : null;
  var caret = focusKey && active.selectionStart != null ? active.selectionStart : null;

  document.getElementById("app").innerHTML =
    '<div style="display:flex;min-height:100vh;background:#fff">' +
      sidebarHTML() +
      '<div style="flex:1;min-width:0;display:flex;flex-direction:column">' +

      '</div>' +
    '</div>' +
    replaceModalHTML() + facultyPanelHTML() + supporterModalHTML() + createModalHTML() + guardModalHTML() + notifyModalHTML() + presAlertHTML() + editAlertHTML() + toastHTML();

  if (focusKey) {
    var el = document.querySelector('[data-focus="' + focusKey.replace(/"/g, '\\"') + '"]');
    if (el) {
      el.focus();
      if (caret != null && el.setSelectionRange) { try { el.setSelectionRange(caret, caret); } catch (e) {} }
    }
  }
  wireDropzones();
}

/* ============================ Behaviour ============================ */

function addPending(list) {
  var items = Array.prototype.slice.call(list || []).map(function (f) {
    return { name: f.name, size: f.size, key: Math.random().toString(36).slice(2) };
  });
  if (!items.length) return;
  state.pending = state.pending.concat(items);
  render();
}

function doUpload() {
  var now = new Date();
  var stamp = String(now.getMonth() + 1).padStart(2, "0") + "/" + String(now.getDate()).padStart(2, "0") + "/" + now.getFullYear() + ", " +
    (((now.getHours() + 11) % 12) + 1) + ":" + String(now.getMinutes()).padStart(2, "0") + " " + (now.getHours() < 12 ? "AM" : "PM");
  state.files = state.files.concat(state.pending.map(function (p) {
    return { id: p.key, name: p.name, size: p.size, date: stamp, uploader: "Douglas Benjamin",
      display: p.name.replace(/\.[^.]+$/, ""), categories: [], status: "", archived: false };
  }));
  state.pending = [];
  flash("Files added");
}

function removeFaculty(id) {
  var f = state.faculty.filter(function (x) { return x.id === id; })[0];
  state.faculty = state.faculty.filter(function (x) { return x.id !== id; });
  flash((f ? f.name.replace(/,.*$/, "") : "Faculty") + " removed from project");
}

function addFaculty(id) {
  if (state.faculty.some(function (x) { return x.id === id; })) return;
  var p = DIRECTORY.filter(function (x) { return x.id === id; })[0];
  if (!p) return;
  state.faculty = state.faculty.concat({
    id: p.id, name: p.name, affiliation: p.affiliation || "—",
    roles: ["Speaker"], financial: "(Pending)", docs: docSet({})
  });
  flash(p.name.replace(/,.*$/, "") + " added to project");
}

function pickSelect(key, val) {
  var parts = key.split(":");
  var kind = parts[0], id = parts.slice(1).join(":");
  if (kind === "fcat") { state.fileCat = val === "All categories" ? "" : val; state.openSelect = null; }
  else if (kind === "fst") { state.fileStatus = val === "All statuses" ? "" : val; state.openSelect = null; }
  else if (kind === "cat") {
    state.files = state.files.map(function (f) {
      if (f.id !== id) return f;
      var has = f.categories.indexOf(val) > -1;
      return Object.assign({}, f, { categories: has ? f.categories.filter(function (c) { return c !== val; }) : f.categories.concat(val) });
    });
    flash("Category updated");
    return;
  } else if (kind === "st") {
    var v = val === "Unassigned" ? "" : val;
    state.files = state.files.map(function (f) { return f.id === id ? Object.assign({}, f, { status: v }) : f; });
    state.openSelect = null;
    flash("Status updated");
    return;
  }
  render();
}

document.addEventListener("click", function (e) {
  var rtBtn = e.target.closest("[data-rt-cmd]");
  if (rtBtn) return; /* handled on mousedown */

  var el = e.target.closest("[data-a]");
  if (!el) {
    if (state.openSelect || state.openCombo) { state.openSelect = null; state.openCombo = ""; render(); }
    return;
  }
  var act = el.getAttribute("data-a");

  /* a scrim only closes on a click that did not come from inside its dialog */
  if (el.hasAttribute("data-scrim") && e.target.closest("[data-stop]")) return;

  if (el.tagName === "A") e.preventDefault();
  e.stopPropagation();
  var fn = ACTIONS[act];
  if (fn) fn(el);
});

document.addEventListener("mousedown", function (e) {
  var btn = e.target.closest("[data-rt-cmd]");
  if (!btn) return;
  e.preventDefault();
  var key = btn.getAttribute("data-rt-key");
  var cmd = btn.getAttribute("data-rt-cmd");
  var arg = btn.getAttribute("data-rt-arg") || undefined;
  var editor = document.querySelector('[data-rt="' + key + '"]');
  if (editor) editor.focus();
  if (cmd === "__link") {
    var url = window.prompt("Enter URL");
    if (url) document.execCommand("createLink", false, url);
  } else {
    document.execCommand(cmd, false, arg);
  }
  if (editor) state.content[key] = editor.innerHTML;
});

document.addEventListener("input", function (e) {
  var t = e.target;

  var field = t.getAttribute && t.getAttribute("data-field");
  if (field) { state.f[field] = t.value; return; }

  var rt = t.getAttribute && t.getAttribute("data-rt");
  if (rt) { state.content[rt] = t.innerHTML; return; }

  var disp = t.getAttribute && t.getAttribute("data-display");
  if (disp) {
    state.files = state.files.map(function (f) { return f.id === disp ? Object.assign({}, f, { display: t.value }) : f; });
    return;
  }

  var key = t.getAttribute && t.getAttribute("data-input");
  if (!key) return;
  if (key === "fileQ") { state.fileQ = t.value; render(); }
  else if (key === "afpQuery") { state.afpQuery = t.value; state.afpPage = 1; render(); }
  else if (key === "modalGrant") { state.modal.grant = t.value; }
  else if (key === "notifyNotes" && state.notify) { state.notify.notes = t.value; render(); }
});

document.addEventListener("blur", function (e) {
  if (e.target.getAttribute && e.target.getAttribute("data-display")) flash("Display name updated");
}, true);

document.getElementById("filePicker").addEventListener("change", function (e) {
  addPending(e.target.files);
  e.target.value = "";
});

document.getElementById("replacePicker").addEventListener("change", function (e) {
  var nf = e.target.files[0];
  if (nf) { state.replaceWith = { name: nf.name, size: nf.size }; render(); }
  e.target.value = "";
});

function wireDropzones() {
  var dz = document.getElementById("dropzone");
  if (dz) {
    dz.addEventListener("dragover", function (e) { e.preventDefault(); if (!state.dragOver) { state.dragOver = true; render(); } });
    dz.addEventListener("dragleave", function () { if (state.dragOver) { state.dragOver = false; render(); } });
    dz.addEventListener("drop", function (e) { e.preventDefault(); state.dragOver = false; addPending(e.dataTransfer.files); });
  }
  var rz = document.getElementById("replaceZone");
  if (rz) {
    rz.addEventListener("dragover", function (e) { e.preventDefault(); });
    rz.addEventListener("drop", function (e) {
      e.preventDefault();
      var nf = e.dataTransfer.files[0];
      if (nf) { state.replaceWith = { name: nf.name, size: nf.size }; render(); }
    });
  }
}

      '<div style="padding:28px 32px 0;display:flex;align-items:center;gap:14px">' +
        '<i class="mdi ' + (editors.length ? "mdi-account-edit-outline" : "mdi-account-eye-outline") + '" style="font-size:26px;line-height:26px;color:' + (editors.length ? "var(--pa-warning)" : "var(--pa-primary)") + '"></i>' +
        '<h3 id="pres-alert-title" class="pa-modal-title" style="margin:0;text-transform:uppercase;letter-spacing:0">' + (editors.length ? "Someone is editing this tab" : "Someone is on this tab") + '</h3>' +
      '</div>' +
      '<div style="padding:18px 32px 0;display:flex;flex-direction:column;gap:6px">' + here.map(function (p) { return personRow(p, "div"); }).join("") + '</div>' +
      '<div style="padding:14px 32px 4px;font-family:var(--pa-font-sans);font-size:14px;line-height:22px;color:var(--pa-ink-2);text-wrap:pretty">' + esc(msg) + '</div>' +
      '<div style="display:flex;justify-content:flex-end;padding:22px 24px"><button class="pa-btn pa-btn--primary" data-a="pres-alert-close"><span>GOT IT</span></button></div>' +
    '</div>' +
  '</div>';
}

setBaseline();
state.presAlert = alertFor(state.tab);
render();
</script>
</body>
</html>
